name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # 手元と同じ Windows で走らせる。`pnpm run apk` が gradlew.bat を呼ぶため
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # JDK 25 では Gradle 8.14 が落ちる（README「JDK 25 では動かない」）。手元と同じ 21 にそろえる
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # テスト（本体の部品を取り込めるか・端末に無いものを読んでいないか。androidReach.test.ts）
      - run: pnpm run test
      # Gradle の本体（gradle-8.14.3-all.zip）を走りのあいだで取っておく。毎回取り直していて、
      # 取ってくる所の時間切れ・504 で3回続けて落ちた（2026-11-08 PR #31）
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      # 型の検査 → 画面のビルド → Android へ写す → APK のビルド。
      # Gradle を取ってくる所でネットが落ちたときのために、3回まで試す
      - name: pnpm run apk（3回まで）
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            pnpm run apk
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "apk の組み立てが落ちた（$i 回目）。30 秒待ってもう一度"
            Start-Sleep -Seconds 30
          }
          exit 1
  changes:
    # iOS に関わるファイル（ios/・capacitor.config・package.json）が変わったか（作者の答え 2026-11-18
    # 「飛ばしてよい（iOS に関わるファイルが変わらない PR だけ）」）。GitHub の Mac が足りず、ios が
    # 割り当てられないまま取り消されることがあったため。main への push ではいつも ios を流す
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if echo "$files" | grep -Eq '^(ios/|capacitor\.config\.|package\.json$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "iOS に関わるファイルが変わらないので、ios を飛ばす"
          fi
  ios:
    # iOS の土台（ios/）へ写せるかを見る。Xcode でのビルドは署名が要るので、ここでは行わない。
    # iOS に関わるファイルが変わらない PR では飛ばす（飛ばした確かめは、マージの決まりでは通ったものとして数える）
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sync:ios
  e2e:
    # 画面の自動テスト（pnpm run e2e。Playwright。作者 2026-11-12「CI に載せる」）。写真の撮影（shots）は入れない
    # windows-latest には Edge が入っているので、playwright.config.ts の channel: "msedge" でブラウザを取り寄せずに走る
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 組み立て（vite build）と vite preview は playwright.config.ts の webServer が行う（CI では毎回立て直す）
      - run: pnpm run e2e
      # 落ちたときだけ、どこで落ちたかの記録（写真・error-context.md）を残す
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/e2e
          retention-days: 7

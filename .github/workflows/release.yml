name: Release
# 更新の仕組み（2）：タグ v<版> を押したら、配る APK と更新の札 update.json を Release に添える（引継ぎ書 155章。
# 共通の決まりは統合の docs/更新の仕組み_共通.md）。
# 配る鍵が Secrets に無ければ、Release を作らずに終わる（試しの鍵で署名した APK は配らない）
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.NOVELAI_KEYSTORE_BASE64 != '' }}
    steps:
      - name: 配る鍵があるか
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Secrets に NOVELAI_KEYSTORE_BASE64 が無いので、Release は作りません（引継ぎ書 155章）"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_KEY == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        if: env.HAS_KEY == 'true'
      # 鍵は「署名して組む」の段だけに渡す（2026-11-21 セキュリティチェックの 2）。依存を入れる・試験・画面の組み立ては
      # 鍵の無い段で済ませる：入れるときのスクリプトや試験の中から、環境の変数の鍵を読み出されないように
      - name: 用意する（鍵なし）
        if: env.HAS_KEY == 'true'
        env:
          NOVELAI_RELEASE: "1"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          pnpm install --frozen-lockfile
          pnpm run test
          pnpm run build
          npx cap sync android
      - name: 署名して組む
        if: env.HAS_KEY == 'true'
        env:
          NOVELAI_RELEASE: "1"
          KEYSTORE_BASE64: ${{ secrets.NOVELAI_KEYSTORE_BASE64 }}
          NOVELAI_KEYSTORE_PASSWORD: ${{ secrets.NOVELAI_KEYSTORE_PASSWORD }}
          NOVELAI_KEY_ALIAS: ${{ secrets.NOVELAI_KEY_ALIAS }}
          NOVELAI_KEY_PASSWORD: ${{ secrets.NOVELAI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export NOVELAI_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$NOVELAI_KEYSTORE_FILE"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$NOVELAI_KEYSTORE_FILE"
          (cd android && chmod +x gradlew && ./gradlew assembleRelease)
      - name: 札を作る（鍵なし）
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/updateTicket.mjs "$version" android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out"
      - name: Release を作る
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/out/novel-ai-mobile-$version.apk" \
            "$RUNNER_TEMP/out/update.json" \
            --title "モバイル版 $version" \
            --notes-file "$RUNNER_TEMP/out/release-notes.md"

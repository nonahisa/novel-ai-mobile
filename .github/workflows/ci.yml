name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # 手元と同じ Windows で走らせる。`pnpm run apk` が gradlew.bat を呼ぶため
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # JDK 25 では Gradle 8.14 が落ちる（README「JDK 25 では動かない」）。手元と同じ 21 にそろえる
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # テスト（本体の部品を取り込めるか・端末に無いものを読んでいないか。androidReach.test.ts）
      - run: pnpm run test
      # Gradle の本体（gradle-8.14.3-all.zip）を走りのあいだで取っておく。毎回取り直していて、
      # 取ってくる所の時間切れ・504 で3回続けて落ちた（2026-11-08 PR #31）
      - uses: gradle/actions/setup-gradle@v4
      # 型の検査 → 画面のビルド → Android へ写す → APK のビルド。
      # Gradle を取ってくる所でネットが落ちたときのために、3回まで試す
      - name: pnpm run apk（3回まで）
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            pnpm run apk
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "apk の組み立てが落ちた（$i 回目）。30 秒待ってもう一度"
            Start-Sleep -Seconds 30
          }
          exit 1
  ios:
    # iOS の土台（ios/）へ写せるかを見る。Xcode でのビルドは署名が要るので、ここでは行わない
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sync:ios
  e2e:
    # 画面の自動テスト（pnpm run e2e。Playwright。作者 2026-11-12「CI に載せる」）。写真の撮影（shots）は入れない
    # windows-latest には Edge が入っているので、playwright.config.ts の channel: "msedge" でブラウザを取り寄せずに走る
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 組み立て（vite build）と vite preview は playwright.config.ts の webServer が行う（CI では毎回立て直す）
      - run: pnpm run e2e
      # 落ちたときだけ、どこで落ちたかの記録（写真・error-context.md）を残す
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/e2e
          retention-days: 7
